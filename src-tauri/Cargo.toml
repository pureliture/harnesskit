[package]
name = "harness-desktop"
version = "0.1.0"
description = "HarnessKit Desktop App — deterministic harness inventory and install"
authors = ["HarnessKit Contributors"]
license = "MIT"
homepage = "https://github.com/pureliture/harnesskit"
repository = "https://github.com/pureliture/harnesskit"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "=0.8.2"
toml_edit = "=0.20.2"
log = "0.4"
regex = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
sha2 = "0.10"
subtle = "2.6"
walkdir = "2.5"
ignore = "0.4"
dirs = "5"
chrono = "0.4"
plist = "1.10"
rustix = { version = "1.1", features = ["fs", "process"] }
url = "2.5"
getrandom = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSAccessibilityProtocols",
  "NSAlert",
  "NSAppearance",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSOpenPanel",
  "NSPanel",
  "NSPasteboard",
  "NSResponder",
  "NSSavePanel",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSProcessInfo",
  "NSString",
  "NSURL",
] }

[dev-dependencies]
tempfile = "3"
