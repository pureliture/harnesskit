  attribution_note: >
    Owned HarnessKit reconstruction of the subagent-driven-development review
    pattern. The two-stage ordered review gate, fix-and-re-review loop,
    implementer status protocol, adversarial reviewer stance, and the three
    load-bearing prompt templates were reconstructed from the obra-superpowers
    subagent-driven-development skill as a pattern reference, not copied
    verbatim; this card preserves that pattern as a definition-only artifact.
    The Matt Pocock skills assimilation Slice D update adapts the review-axis
    separation pattern from review-oriented material without copied text. The
    definition-only / non-installable / fail-if-selected contract follows the
    in-project spec-to-tdd and harness-creation workflow precedents. The
    approved engineering-refresh SoT withdrew this as an entrypoint, and the
    later Agentic/Guided contract removes the false current-owner handoff. This
    card keeps only historical context. The original source is not required at runtime;
    the card is self-contained.
  source_mode: referenced
  reconstructed_sections:
    - two_stage_ordered_review_gate
    - implementer_status_protocol
    - fix_and_re_review_loop
    - adversarial_reviewer_stance
    - three_prompt_templates
  excluded_concepts:
    - automatic multi-agent execution runner (definition-only; no runtime engine)
    - new user-facing high-risk workflow invocation or current execution-policy ownership
    - adapter output emission (fail-if-selected)
    - branch / commit / push / PR operations
  copied_sections: []
  rewritten_sections:
    - manual two-stage review sequence
    - card-only runtime boundary
  new_sections:
    - HarnessKit definition-only review-gate stop conditions
    - historical-record-only replacement boundary
    - review-axis boundary for spec and code-quality findings
  license_notes: "Reconstructed pattern; no bundled third-party code copied. Source license_hint: unknown for obra-superpowers and mattpocock-skills."
  human_review_required: true
  review_triggers:
    - condition: upstream_snapshot_changed
      action: Recheck whether the reconstructed review-gate pattern still matches intent.
      severity: low
    - condition: agentic_execution_contract_changed
      action: Recheck the historical replacement boundary; do not restore a workflow entrypoint.
      severity: low
    - condition: workflow_runner_added
      action: Re-evaluate the definition-only boundary if a runtime runner is designed.
      severity: medium
    - condition: installable_kind_boundary_changed
      action: Recheck installable:false and fail-if-selected adapter output policy.
      severity: medium
    - condition: review_axis_gate_changed
      action: Recheck that spec and code-quality review findings remain separate.
      severity: low
