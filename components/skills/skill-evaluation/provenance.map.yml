component_id: harnesskit.skill.skill-evaluation
provenance:
  mode: adapted
  runtime_dependency_on_sources: false
  sources:
    - source_id: reference-provenance-gates-requirements
      role: approved_requirements_sot
      influence:
        - "static source/provenance traceability gate"
        - "registry-side versus component-side failure reporting"
        - "reference-time snapshot as durable truth"
        - "latest upstream as freshness comparison only"
      copied_content: false
      adapted_content: true
    - source_id: reference-provenance-gates-blueprint
      role: approved_blueprint_slice_4
      influence:
        - "evaluation surface reporting slice"
        - "static failures cannot be masked as runtime deferrals"
        - "no live probe and no mutation evaluation boundary"
      copied_content: false
      adapted_content: true
    - source_id: harness-authoring-vertical-capability-slice-requirements
      source_path: sources/harness-authoring-provenance.md
      role: historical_requirements_influence
      influence:
        - same-slice evidence and PASS-only progression gate
        - non-PASS current-slice retention and reporting contract
        - excluded runtime proof truth boundary
      copied_content: false
      adapted_content: true
    - source_id: harness-authoring-vertical-capability-slice-blueprint
      source_path: sources/harness-authoring-provenance.md
      role: historical_blueprint_influence
      influence:
        - current capability slice identity and closure contract
        - cross-slice evidence rejection
        - evaluator non-ownership of next-slice advancement
      copied_content: false
      adapted_content: true
    - source_id: obra-superpowers
      snapshot_id: obra-superpowers/2026-06-27-main-896224c
      influence:
        - "writing-skills craft: skill craft evaluation lenses (CSO description = when-not-what; pattern only)"
        - "writing-skills craft: baseline-first / subagent pressure-testing heuristics (pattern only)"
      copied_content: false
      adapted_content: true
    - source_id: mattpocock-skills
      snapshot_id: mattpocock-skills/2026-06-27-main-5d78bd0
      source_path: skills/productivity/writing-great-skills
      influence:
        - "skill authoring quality rubric for trigger clarity, bounded scope, instruction hierarchy, progressive disclosure, examples/templates, and no-op pruning (pattern only)"
      copied_content: false
      adapted_content: true
      runtime_dependency_on_sources: false
    - source_id: mattpocock-skills
      snapshot_id: mattpocock-skills/2026-06-27-main-5d78bd0
      source_path: skills/productivity/teach
      influence:
        - "bounded instructional unit, mission-fit, feedback-loop, and reference-material quality checks as evaluation lenses (pattern only)"
      copied_content: false
      adapted_content: true
      runtime_dependency_on_sources: false
    - source_id: mattpocock-skills
      snapshot_id: mattpocock-skills/2026-06-27-main-5d78bd0
      source_path: skills/in-progress/review
      influence:
        - "separate review axes and evidence-backed findings for evaluation reporting (pattern only)"
      copied_content: false
      adapted_content: true
      runtime_dependency_on_sources: false
  source_mode: referenced
  copied_sections: []
  rewritten_sections:
    - evidence-before-claims evaluation gate
    - pass/deferred/failure verdict rules
  new_sections:
    - HarnessKit requirements and blueprint conformance gates
    - static adapter versus runtime proof split
    - source/provenance reference-time snapshot traceability gate
    - registry-side and component-side failure reporting
  adapted_sections:
    - source/provenance gate reporting from approved reference provenance gates requirements and blueprint
    - skill craft heuristics (CSO description quality; baseline / pressure-test evidence) from writing-skills craft
    - skill authoring quality rubric from Matt Pocock writing-great-skills, teach, and review-oriented material
    - current capability slice closure from then-approved, now-retired local VC-03 requirements and blueprint
  license_notes: >
    Referenced local installed skill patterns and approved repository-local
    requirements/blueprint only; no bundled third-party code copied.
    writing-skills craft influence is pattern-only with license_hint unknown on
    obra-superpowers. Matt Pocock skills influence is pattern-only from the
    registered snapshot with license_hint unknown; copied_content is false and
    runtime_dependency_on_sources is false.
  human_review_required: true
attribution_note: >
  HarnessKit skill-evaluation authored from the approved body design. Its
  provenance records the local requirements and blueprint, reference-provenance
  gates, writing-skills craft, and Matt Pocock skills snapshot used as design
  influences. No source text was copied verbatim.
review_triggers:
  - condition: evaluation_gate_changed
  - condition: source_registry_snapshot_contract_changed
  - condition: provenance_linkage_gate_changed
  - condition: static_traceability_failure_reporting_changed
  - condition: upstream_freshness_model_changed
  - condition: runtime_truth_policy_changed
  - condition: adapter_output_contract_changed
  - condition: skill_craft_heuristics_changed
  - condition: skill_authoring_quality_gate_changed
  - condition: capability_slice_contract_changed
