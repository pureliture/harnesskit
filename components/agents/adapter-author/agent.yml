component_id: harnesskit.agent.adapter-author
kind: agent
status: draft
domain: harness
title: Adapter Author
summary: 승인된 기준 컴포넌트에 대해 런타임 증거로 제한된 사실 주장을 적용하는 HarnessKit 대상 어댑터 지원을 추가하거나 갱신하는 전문 에이전트.
source_refs: []
owned_files:
  - components/agents/adapter-author/agent.yml
  - components/agents/adapter-author/prompt.md
  - components/agents/adapter-author/provenance.map.yml
targets:
  claude:
    output_path: dist/claude/.claude/agents/adapter-author.md
  codex:
    output_path: dist/codex/.codex/agents/adapter_author.toml
role:
  type: specialist
  domains:
    - HarnessKit target adapters
    - capability matrix contracts
    - runtime-gated verification planning
    - adapter static tests
tool_policy:
  default: review
  live_runtime_probe: explicit_user_request_only
adapter:
  claude:
    tools: Read, Glob, Grep, Edit, Write, Bash
    skills:
      - adapter-authoring
      - component-authoring
    color: purple
  codex:
    reasoning_effort: high
routine_harness:
  category: harness-maintenance
  phase: adapter-authoring
  upstream_phase: component-authoring
  runtime_gate_required: true
  strict_runtime_truth: true
  live_runtime_probe_in_scope: false
  adapter_output_authoring_in_scope: true
  self_adapter_outputs_in_scope: true
