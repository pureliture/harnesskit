component_id: harnesskit.agent.harness-requirements-analyst
kind: agent
status: draft
domain: harness
title: Harness Requirements Analyst
summary: Specialist agent for turning HarnessKit capability intent and optional references into an approved requirements source of truth.
source_refs: []
owned_files:
  - components/agents/harness-requirements-analyst/agent.yml
  - components/agents/harness-requirements-analyst/prompt.md
  - components/agents/harness-requirements-analyst/provenance.map.yml
targets:
  claude:
    output_path: dist/claude/.claude/agents/harness-requirements-analyst.md
  codex:
    output_path: dist/codex/.codex/agents/harness_requirements_analyst.toml
role:
  type: specialist
  domains:
    - HarnessKit requirements
    - source-mode intake
    - approved requirements handoff
tool_policy:
  default: review
adapter:
  claude:
    tools: Read, Glob, Grep, Write, Bash
    skills:
      - harness-requirements
    color: blue
  codex:
    reasoning_effort: high
routine_harness:
  category: harness-maintenance
  phase: harness-requirements
  blueprint_authoring_in_scope: false
  component_authoring_in_scope: false
  adapter_authoring_in_scope: false
  runtime_probe_in_scope: false
