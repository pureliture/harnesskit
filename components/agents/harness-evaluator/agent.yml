component_id: harnesskit.agent.harness-evaluator
kind: agent
status: draft
domain: harness
title: Harness Evaluator
summary: Top-level HarnessKit evaluation orchestrator that calls existing gate procedure, deterministic validators, fixture isolation, allowlist/profile contamination checks, runtime proof runner, and report generation without modifying source or canonical files.
source_refs:
  - source_id: harness-evaluation-requirements
    path: sources/requirements.md
    used_for:
      - approved_requirements_sot
      - boundary_and_safety_rules
      - evidence_expectations
  - source_id: harness-evaluation-blueprint
    path: sources/blueprint.md
    used_for:
      - slice_1_authoring_contract
      - top_level_orchestrator_boundary
      - deferred_runtime_and_adapter_work
  - source_id: harness-evaluation-local-reference
    path: sources/harness-evaluation-reference.yml
    used_for:
      - local_skill_evaluation_gate_patterns
      - runtime_probe_evidence_requirements
      - static_validation_patterns
  - source_id: harness-evaluation-oss-reference
    path: sources/harness-evaluation-oss-reference.yml
    used_for:
      - structure_only_evaluation_patterns
      - copied_content_boundary
  - source_id: mattpocock-skills
    path: skills/productivity/writing-great-skills
    used_for:
      - skill_authoring_quality_gate_orchestration
      - trigger_scope_progressive_disclosure_checks
  - source_id: mattpocock-skills
    path: skills/productivity/teach
    used_for:
      - bounded_instruction_and_feedback_quality_checks
  - source_id: mattpocock-skills
    path: skills/in-progress/review
    used_for:
      - review_axis_separation_and_evidence_reporting_checks
owned_files:
  - components/agents/harness-evaluator/agent.yml
  - components/agents/harness-evaluator/prompt.md
  - components/agents/harness-evaluator/provenance.map.yml
targets:
  claude:
    output_path: dist/claude/.claude/agents/harness-evaluator.md
  codex:
    output_path: dist/codex/.codex/agents/harness_evaluator.toml
adapter:
  claude:
    tools: Read, Glob, Grep, Bash
    skills:
      - skill-evaluation
    color: cyan
  codex:
    reasoning_effort: high
role:
  type: orchestrator
  domains:
    - HarnessKit evaluation planning
    - static proof coordination
    - runtime proof evidence requirements
    - fixture isolation evidence
    - profile contamination checks
    - skill authoring quality gate reporting
    - evaluation report generation
tool_policy:
  default: review
  source_mutation: deny
  adapter_output_generation: deny
  live_runtime_probe: deny
routine_harness:
  category: harness-maintenance
  phase: harness-evaluation
  top_level_orchestrator: true
  reused_gate_component: harnesskit.skill.skill-evaluation
  source_and_canonical_edits_in_scope: false
  profile_edits_in_scope: false
  adapter_output_authoring_in_scope: false
  live_runtime_probe_in_scope: false
  strict_static_runtime_split: true
  output_allowlist_enforced: true
provenance_mode: referenced
