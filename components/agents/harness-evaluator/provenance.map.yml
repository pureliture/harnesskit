  attribution_note: >
    Original HarnessKit evaluator agent authored from approved local requirements
    and blueprint Slice 1. Local and OSS references influenced only structural
    evaluation patterns. No reference code or prose was copied, no adapter output
    was generated, and no runtime support is claimed. The reference provenance
    gates update adapts approved local requirements and blueprint Slice 4 into
    static source/provenance reporting guidance. The Matt Pocock skills
    assimilation Slice D update adds orchestration/reporting visibility for
    skill authoring quality gates without copying source text or expanding
    runtime responsibilities.
  copied_sections: []
  adapted_sections: []
  rewritten_sections:
    - top-level evaluation orchestration responsibilities
    - static proof and runtime proof separation
    - profile contamination and output allowlist gates
    - model and budget gate requirements
  new_sections:
    - evaluator-specific source mutation ban
    - runtime proof evidence-only handling
    - harness-maintenance optimal-response contamination failure rule
    - rh draft residue finding rule for this evaluator family
    - reference-time snapshot traceability reporting
    - registry-side and component-side source/provenance failure split
    - explicit skill authoring quality gate reporting
  license_notes: >
    Repository-local sources are upstream SoT inputs, including the approved
    reference provenance gates requirements and blueprint. OSS packet entries
    are pattern-only references with mixed licenses; copied content is not
    allowed by this component record. Matt Pocock skills references are
    pattern-only from the registered snapshot; copied_content is false and
    runtime_dependency_on_sources is false.
