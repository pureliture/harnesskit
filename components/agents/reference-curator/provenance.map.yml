      role: approved_requirements_sot
      copied_content: false
      adapted_content: false
      license: Repository local SoT
      runtime_support_claimed: false
      used_for:
        - reference_time_snapshot_model
        - observed_identity_required_fields
        - license_quality_runtime_claim_boundary
    - source_id: reference-provenance-gates-blueprint
      role: slice_1_authoring_contract
