<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" role="img" aria-labelledby="model-title model-desc"><title id="model-title">컴포넌트와 대상 파일의 관계</title><desc id="model-desc">출처 기록과 canonical 컴포넌트, registry 색인, profile 선택, workflow 단계 참조, output adapter와 생성된 파일의 관계.</desc><defs><marker id="model-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#18334f} .title{font-size:23px;font-weight:700} .body{font-size:17px} .label{font-size:16px;font-weight:600} .small{font-size:15px}</style><rect width="1440" height="740" fill="#fbfdff"/><text x="50" y="55" text-anchor="start" class="title">정의는 한 곳에 두고, 목적별로 선택한 뒤 도구별 파일 형식으로 변환합니다.</text><path d="M265 208 H350" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#model-arrow)"/><rect x="270.0" y="168" width="76" height="27" rx="6" fill="#fbfdff"/><text x="308" y="188" text-anchor="middle" class="label">출처 연결</text><path d="M630 205 H740" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#model-arrow)"/><rect x="647.0" y="166" width="76" height="27" rx="6" fill="#fbfdff"/><text x="685" y="186" text-anchor="middle" class="label">선택</text><path d="M1005 196 H1063 V290 H1120" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#model-arrow)"/><rect x="1018.0" y="225" width="78" height="27" rx="6" fill="#fbfdff"/><text x="1057" y="245" text-anchor="middle" class="label">선택한 구성</text><path d="M630 290 H1120" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#model-arrow)"/><rect x="791.0" y="256" width="156" height="27" rx="6" fill="#fbfdff"/><text x="869" y="276" text-anchor="middle" class="label">canonical 내용</text><path d="M490 410 V320" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#model-arrow)" stroke-dasharray="7 5"/><rect x="418.5" y="355" width="143" height="27" rx="6" fill="#fbfdff"/><text x="490" y="375" text-anchor="middle" class="label">ID·명세 경로 색인</text><path d="M740 485 H690 V306 H630" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#model-arrow)" stroke-dasharray="7 5"/><rect x="651.0" y="360" width="78" height="27" rx="6" fill="#fbfdff"/><text x="690" y="380" text-anchor="middle" class="label">단계별 참조</text><path d="M1257 410 V530" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#model-arrow)"/><rect x="1301.0" y="460" width="78" height="27" rx="6" fill="#fbfdff"/><text x="1340" y="480" text-anchor="middle" class="label">대상별 투영</text><rect x="40" y="130" width="225" height="154" rx="14" fill="#f4f6f8" stroke="#bdc8d4" stroke-width="2"/><text x="152.5" y="164" text-anchor="middle" class="title">Sources</text><text x="152.5" y="194" text-anchor="middle" class="body">참조 자료와 사용 근거</text><text x="152.5" y="218" text-anchor="middle" class="body">sources/</text><rect x="350" y="130" width="280" height="190" rx="14" fill="#eff6ff" stroke="#93b4f7" stroke-width="2"/><text x="490.0" y="164" text-anchor="middle" class="title">Canonical Component</text><text x="490.0" y="194" text-anchor="middle" class="body">Skill · Agent · Rule · Hook</text><text x="490.0" y="218" text-anchor="middle" class="body">내용 · scope · 소유권</text><text x="490.0" y="242" text-anchor="middle" class="body">components/</text><rect x="740" y="130" width="265" height="126" rx="14" fill="#f5f1ff" stroke="#bba0f4" stroke-width="2"/><text x="872.5" y="164" text-anchor="middle" class="title">Profile</text><text x="872.5" y="194" text-anchor="middle" class="body">목적별 component 선택</text><text x="872.5" y="218" text-anchor="middle" class="body">profiles/</text><rect x="350" y="410" width="280" height="140" rx="14" fill="#eefaf5" stroke="#7bc7b4" stroke-width="2"/><text x="490.0" y="444" text-anchor="middle" class="title">Registry</text><text x="490.0" y="474" text-anchor="middle" class="body">component ID와 경로 색인</text><text x="490.0" y="498" text-anchor="middle" class="body">components/registry.yml</text><rect x="740" y="410" width="265" height="140" rx="14" fill="#eefaf5" stroke="#7bc7b4" stroke-width="2"/><text x="872.5" y="444" text-anchor="middle" class="title">Workflow</text><text x="872.5" y="474" text-anchor="middle" class="body">단계와 역할의 관계</text><text x="872.5" y="498" text-anchor="middle" class="body">component ID 참조</text><rect x="1120" y="260" width="275" height="150" rx="14" fill="#f5f1ff" stroke="#bba0f4" stroke-width="2"/><text x="1257.5" y="294" text-anchor="middle" class="title">Output Adapter</text><text x="1257.5" y="324" text-anchor="middle" class="body">target 형식으로 변환</text><text x="1257.5" y="348" text-anchor="middle" class="body">adapters/</text><rect x="1120" y="530" width="275" height="154" rx="14" fill="#f4f6f8" stroke="#bdc8d4" stroke-width="2"/><text x="1257.5" y="564" text-anchor="middle" class="title">생성되는 대상 파일</text><text x="1257.5" y="594" text-anchor="middle" class="body">AGENTS.md · CLAUDE.md</text><text x="1257.5" y="618" text-anchor="middle" class="body">Skill · Agent · 설정 파일</text><text x="40" y="655" text-anchor="start" class="body">Workflow는 실행 단계의 관계를 나타내며, Profile의 선택 목록과 별도로 관리됩니다.</text><text x="40" y="689" text-anchor="start" class="body">Output adapter는 파일을 생성합니다. Discovery adapter는 로컬 설치 파일을 탐색하는 별도 역할입니다.</text></svg>