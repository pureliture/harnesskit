<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 970" role="img" aria-labelledby="seq-title seq-desc"><title id="seq-title">Preview 승인 적용 검증 시퀀스</title><desc id="seq-desc">사용자가 설치 대상을 선택하면 dry-run plan을 생성한다. 승인된 preview와 현재 source 및 target을 재대조한 뒤 Rust writer가 기록하고 verifier가 readback하여 결과를 반환한다.</desc><defs><marker id="seq-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#18334f} .title{font-size:23px;font-weight:700} .body{font-size:17px} .label{font-size:16px;font-weight:600} .small{font-size:15px}</style><rect width="1440" height="970" fill="#fbfdff"/><rect x="22" y="25" width="216" height="70" rx="14" fill="#eff6ff" stroke="#93b4f7" stroke-width="2"/><text x="130.0" y="59" text-anchor="middle" class="title">사용자 · UI</text><line x1="130" y1="95" x2="130" y2="927" stroke="#c6d2df" stroke-width="2" stroke-dasharray="6 6"/><rect x="347" y="25" width="216" height="70" rx="14" fill="#eff6ff" stroke="#93b4f7" stroke-width="2"/><text x="455.0" y="59" text-anchor="middle" class="title">Rust 설치 조정</text><line x1="455" y1="95" x2="455" y2="927" stroke="#c6d2df" stroke-width="2" stroke-dasharray="6 6"/><rect x="707" y="25" width="216" height="70" rx="14" fill="#eff6ff" stroke="#93b4f7" stroke-width="2"/><text x="815.0" y="59" text-anchor="middle" class="title">내장 Python</text><line x1="815" y1="95" x2="815" y2="927" stroke="#c6d2df" stroke-width="2" stroke-dasharray="6 6"/><rect x="1102" y="25" width="216" height="70" rx="14" fill="#f4f6f8" stroke="#bdc8d4" stroke-width="2"/><text x="1210.0" y="59" text-anchor="middle" class="title">대상 파일</text><line x1="1210" y1="95" x2="1210" y2="927" stroke="#c6d2df" stroke-width="2" stroke-dasharray="6 6"/><rect x="30" y="112" width="1370" height="333" rx="12" fill="#eff6ff" opacity=".65"/><text x="52" y="142" text-anchor="start" clas