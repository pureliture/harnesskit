seq-arrow)" stroke-dasharray="7 5"/><rect x="227.0" y="405" width="130" height="27" rx="6" fill="#fbfdff"/><text x="292" y="425" text-anchor="middle" class="label">Preview 표시</text><text x="1210" y="322" text-anchor="middle" class="small">아직 파일 기록 없음</text><path d="M130 540 H455" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#seq-arrow)"/><rect x="201.0" y="506" width="182" height="27" rx="6" fill="#fbfdff"/><text x="292" y="526" text-anchor="middle" class="label">표시된 Preview 승인</text><path d="M455 597 H815" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#seq-arrow)"/><rect x="537.5" y="564" width="195" height="27" rx="6" fill="#fbfdff"/><text x="635" y="584" text-anchor="middle" class="label">Apply용 plan 재생성</text><path d="M815 642 H455" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#seq-arrow)" stroke-dasharray="7 5"/><rect x="550.5" y="610" width="169" height="27" rx="6" fill="#fbfdff"/><text x="635" y="630" text-anchor="middle" class="label">Apply plan 반환</text><rect x="325" y="667" width="600" height="58" rx="14" fill="#f5f1ff" stroke="#bba0f4" stroke-width="2"/><text x="625.0" y="701" text-anchor="middle" class="title">원본 · 대상 · 승인 fingerprint · plan 의미 재대조</text><path d="M455 763 H1210" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#seq-arrow)"/><rect x="604.5" y="730" width="455" height="27" rx="6" fill="#fbfdff"/><text x="832" y="750" text-anchor="middle" class="label">Rust Writer: 승인한 destination에 생성·병합</text><path d="M1210 820 H455" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#seq-arrow)" stroke-dasharray="7 5"/><rect x="611.0" y="787" width="442" height="27" rx="6" fill="#fbfdff"/><text x="832" y="807" text-anchor="middle" class="label">Rust Verifier: 파일을 다시 읽어 기대 내용과 비교</text><path d="M455 886 H130" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#seq-arrow)" stroke-dasharray="7 5"/><rect x="162.0" y="853" width="260" height="27" rx="6" fill="#fbfdff"/><text x="292" y="873" text-anchor="middle" class="label">파일별 결과 + 적용 evidence</text><text x="50" y="949" text-anchor="start" class="body">입력이 바뀌면 기존 승인을 재사용하지 않고 새 Preview가 필요합니다.</text></svg>