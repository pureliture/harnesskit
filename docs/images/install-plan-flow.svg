<svg width="100%" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Install plan flow: plan dry-run, consent gate, apply, verify, with apply.py refusal conditions">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1410"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="amber2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arr2" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29e"/>
    </marker>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="470" rx="20" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1198" height="468" rx="19" fill="none" stroke="#292524"/>

  <text x="50" y="56" fill="#10b981" font-size="13" font-weight="700" letter-spacing="4">CONSENT-GATED INSTALL</text>
  <text x="50" y="92" fill="#fafaf9" font-size="28" font-weight="800" letter-spacing="-0.5">plan <tspan fill="#57534e">·</tspan> apply <tspan fill="#57534e">·</tspan> verify</text>

  <!-- flow arrows -->
  <g stroke="#a8a29e" stroke-width="2" marker-end="url(#arr2)">
    <line x1="350" y1="190" x2="436" y2="190"/>
    <line x1="556" y1="190" x2="642" y2="190"/>
    <line x1="922" y1="190" x2="1008" y2="190"/>
  </g>

  <!-- step 1: plan (dry-run) -->
  <rect x="50" y="128" width="300" height="124" rx="14" fill="#0f1512" stroke="#10b981"/>
  <text x="74" y="166" fill="#34d399" font-size="13" font-weight="800" letter-spacing="2">① PLAN — DRY-RUN</text>
  <text x="74" y="196" fill="#a7f3d0" font-size="12.5" font-family="ui-monospace,Menlo,monospace">plan.py --profile engineering</text>
  <text x="74" y="216" fill="#a7f3d0" font-size="12.5" font-family="ui-monospace,Menlo,monospace">  --mode dry-run --format json</text>
  <text x="74" y="238" fill="#6b9a85" font-size="11.5">검토 전용 · 체크인 계약 형태</text>

  <!-- consent gate (shield) -->
  <g filter="url(#glow2)">
    <path d="M496 120 L556 138 L556 198 Q556 236 496 256 Q436 236 436 198 L436 138 Z" fill="#1a120b" stroke="url(#amber2)" stroke-width="2.5"/>
  </g>
  <text x="496" y="178" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="800">⌘</text>
  <text x="496" y="206" text-anchor="middle" fill="#fde68a" font-size="10.5" font-weight="700">CONSENT</text>
  <text x="496" y="222" text-anchor="middle" fill="#fde68a" font-size="10.5" font-weight="700">GATE</text>

  <!-- step 2: apply -->
  <rect x="642" y="128" width="280" height="124" rx="14" fill="#1a120b" stroke="url(#amber2)" stroke-width="2"/>
  <text x="666" y="166" fill="#fbbf24" font-size="13" font-weight="800" letter-spacing="2">② APPLY</text>
  <text x="666" y="196" fill="#fde68a" font-size="12.5" font-family="ui-monospace,Menlo,monospace">apply.py plan.json</text>
  <text x="666" y="216" fill="#fde68a" font-size="12.5" font-family="ui-monospace,Menlo,monospace">  --target-root &lt;project&gt;</text>
  <text x="666" y="238" fill="#d6a86b" font-size="11.5">mode=apply 만 허용 · materialize</text>

  <!-- step 3: verify -->
  <rect x="1008" y="128" width="150" height="124" rx="14" fill="#0c141a" stroke="#0ea5e9"/>
  <text x="1030" y="166" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="2">③ VERIFY</text>
  <text x="1030" y="196" fill="#bae6fd" font-size="12" font-family="ui-monospace,Menlo,monospace">verify.py</text>
  <text x="1030" y="216" fill="#bae6fd" font-size="12" font-family="ui-monospace,Menlo,monospace">plan.json</text>
  <text x="1030" y="238" fill="#5f8aa0" font-size="11.5">적용 결과 검증</text>

  <!-- refusal callout -->
  <rect x="50" y="296" width="1108" height="138" rx="14" fill="#190f0c" stroke="#7c2d12"/>
  <text x="74" y="330" fill="#f87171" font-size="14" font-weight="800" letter-spacing="1">⛔ apply.py 가 거부하는 것</text>
  <text x="74" y="352" fill="#a8a29e" font-size="12">검토 후 명시 허가 전에는 다음을 모두 막는다.</text>

  <!-- refusal chips -->
  <g font-size="12.5" font-weight="700">
    <rect x="74"  y="372" width="180" height="40" rx="10" fill="#1c1410" stroke="#7c2d12"/>
    <text x="164" y="397" text-anchor="middle" fill="#fca5a5">경로 이탈</text>

    <rect x="270" y="372" width="220" height="40" rx="10" fill="#1c1410" stroke="#7c2d12"/>
    <text x="380" y="397" text-anchor="middle" fill="#fca5a5">교차 타겟 산출물 불일치</text>

    <rect x="506" y="372" width="170" height="40" rx="10" fill="#1c1410" stroke="#7c2d12"/>
    <text x="591" y="397" text-anchor="middle" fill="#fca5a5">비허용 scope</text>

    <rect x="692" y="372" width="210" height="40" rx="10" fill="#1c1410" stroke="#7c2d12"/>
    <text x="797" y="397" text-anchor="middle" fill="#fca5a5">예상치 못한 덮어쓰기</text>

    <rect x="918" y="372" width="240" height="40" rx="10" fill="#1c1410" stroke="#f59e0b"/>
    <text x="1038" y="391" text-anchor="middle" fill="#fbbf24">런타임 hook 표면</text>
    <text x="1038" y="406" text-anchor="middle" fill="#9a7b5f" font-size="10" font-weight="600">--allow-runtime-hooks 필요</text>
  </g>
</svg>
