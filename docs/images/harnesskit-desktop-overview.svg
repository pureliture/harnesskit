  <text x="858" y="370" fill="#334155" font-size="12.5" font-weight="750">승인된 의도를 기준 명세의</text>
  <text x="858" y="389" fill="#334155" font-size="12.5" font-weight="750">컴포넌트 레코드로 작성합니다.</text>
  <text x="858" y="425" fill="#64748b" font-size="10.5" font-weight="800" letter-spacing="1.2">대상별 미리보기</text>
  <rect x="858" y="439" width="270" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
