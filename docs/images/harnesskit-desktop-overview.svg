  <text x="642" y="571" text-anchor="middle" fill="#6d28d9" font-size="11.5" font-weight="800">에이전트</text>
  <rect x="704" y="548" width="104" height="37" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="756" y="571" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="800">워크플로우</text>

  <!-- right detail -->
  <text x="858" y="268" fill="#64748b" font-size="10.5" font-weight="800" letter-spacing="1.5">선택한 명세</text>
  <text x="858" y="294" fill="#0f172a" font-size="17" font-weight="850">컴포넌트 상세</text>
  <line x1="858" y1="308" x2="1128" y2="308" stroke="#cbd5e1"/>
  <text x="858" y="338" fill="#2563eb" font-size="11" font-weight="800">컴포넌트 작성</text>
  <rect x="1038" y="321" width="76" height="24" rx="6" fill="#ecfeff" stroke="#67e8f9"/>
