    <circle cx="486" cy="343" r="12" fill="#2563eb"/>
    <circle cx="488" cy="400" r="12" fill="#7c3aed"/>
    <circle cx="480" cy="454" r="12" fill="#0891b2"/>
    <circle cx="600" cy="368" r="14" fill="#0f766e"/>
