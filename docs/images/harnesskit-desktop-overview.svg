  <text x="1110" y="462" text-anchor="end" fill="#0f172a" font-size="10.5" font-family="ui-monospace, Menlo, monospace">.claude/skills/…</text>
  <text x="874" y="486" fill="#475569" font-size="11.5">Codex</text>
  <text x="1110" y="486" text-anchor="end" fill="#0f172a" font-size="10.5" font-family="ui-monospace, Menlo, monospace">.agents/skills/…</text>
  <rect x="858" y="520" width="270" height="44" rx="9" fill="url(#brand)"/>
  <text x="993" y="547" text-anchor="middle" fill="#fff7ed" font-size="12.5" font-weight="850">설치 계획 보기</text>
  <text x="993" y="584" text-anchor="middle" fill="#64748b" font-size="10.5">선택 → 미리보기 → 명시 확인</text>

  <!-- meaning callouts -->
  <g>
