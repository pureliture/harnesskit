  <rect x="64" y="202" width="205" height="32" rx="7" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="166.5" y="223" text-anchor="middle" fill="#1e3a8a" font-size="12.5" font-weight="800">SoT 명세 대시보드</text>
  <text x="365" y="223" text-anchor="middle" fill="#475569" font-size="12.5" font-weight="750">PC 설치 하네스</text>

