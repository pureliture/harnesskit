  <text x="387" y="415" text-anchor="middle" fill="#92400e" font-size="10" font-weight="800">프로필</text>

  <line x1="309" y1="509" x2="814" y2="509" stroke="#cbd5e1"/>
  <text x="316" y="535" fill="#64748b" font-size="10.5" font-weight="800" letter-spacing="1.5">프로필 구성</text>
  <rect x="316" y="548" width="150" height="37" rx="8" fill="#fff7ed" stroke="#fb923c"/>
