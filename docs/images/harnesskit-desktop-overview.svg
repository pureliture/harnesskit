    <circle cx="78" cy="659" r="17" fill="#f59e0b"/>
    <text x="78" y="665" text-anchor="middle" fill="#1c1410" font-size="14" font-weight="900">1</text>
    <text x="108" y="653" fill="#fde68a" font-size="13" font-weight="850">무엇이 있는가</text>
    <text x="108" y="674" fill="#a8a29e" font-size="11.5">기준 목록과 원본을 확인</text>

