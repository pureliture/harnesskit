    <text x="236" y="497" text-anchor="middle" fill="#0e7490" font-size="9.5" font-weight="800">스킬</text>
    <text x="84" y="526">• 하네스 제작 흐름</text>
    <rect x="194" y="511" width="70" height="20" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="229" y="525" text-anchor="middle" fill="#047857" font-size="9.5" font-weight="800">워크플로우</text>
  </g>

  <!-- center map -->
  <text x="316" y="268" fill="#64748b" font-size="10.5" font-weight="800" letter-spacing="1.5">관계 지도</text>
  <text x="316" y="294" fill="#0f172a" font-size="17" font-weight="850">컴포넌트 관계</text>
  <rect x="716" y="259" width="92" height="30" rx="7" fill="#f8fafc" stroke="#94a3b8"/>
