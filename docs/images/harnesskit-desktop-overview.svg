    <text x="246" y="412" text-anchor="end">전체</text>
    <text x="84" y="442">• 어댑터 작성</text>
    <rect x="208" y="427" width="56" height="20" rx="5" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="236" y="441" text-anchor="middle" fill="#4338ca" font-size="9.5" font-weight="800">에이전트</text>
    <text x="84" y="470">• 블루프린트 작성</text>
    <rect x="208" y="455" width="56" height="20" rx="5" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="236" y="469" text-anchor="middle" fill="#4338ca" font-size="9.5" font-weight="800">에이전트</text>
