  <text x="177" y="168" fill="#0f172a" font-size="14" font-weight="800">HarnessKit</text>
  <text x="177" y="184" fill="#64748b" font-size="10.5">하네스 명세 지도</text>

  <rect x="320" y="155" width="244" height="31" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
