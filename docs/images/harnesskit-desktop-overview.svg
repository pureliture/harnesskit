<svg width="100%" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard" role="img" aria-labelledby="title desc">
  <title id="title">HarnessKit Desktop 핵심 화면</title>
  <desc id="desc">왼쪽 기준 명세 목록, 가운데 컴포넌트 관계 지도, 오른쪽 선택 항목 상세와 설치 계획, 아래쪽 로컬 설치 하네스 탐색 기능을 보여 주는 화면 구조</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1410"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="718" rx="23" fill="none" stroke="#292524"/>

  <text x="48" y="50" fill="#f59e0b" font-size="13" font-weight="800" letter-spacing="4">HARNESSKIT DESKTOP</text>
  <text x="48" y="88" fill="#fafaf9" font-size="28" font-weight="850">파일을 열기 전에 구조를 이해하고, 쓰기 전에 변경을 확인합니다</text>
  <text x="48" y="116" fill="#a8a29e" font-size="14">실제 제품의 정보 구조를 단순화한 안내 그림 · 기준 명세와 로컬 설치 상태는 별도 대시보드</text>

  <g filter="url(#shadow)">
    <rect x="48" y="144" width="1104" height="458" rx="18" fill="url(#window)" stroke="#64748b"/>
  </g>

  <!-- macOS title bar -->
  <path d="M48 162 Q48 144 66 144 H1134 Q1152 144 1152 162 V197 H48 Z" fill="#e2e8f0"/>
  <circle cx="70" cy="170" r="6" fill="#ef4444"/>
  <circle cx="90" cy="170" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="170" r="6" fill="#10b981"/>

  <!-- product identity -->
  <rect x="137" y="155" width="30" height="30" rx="8" fill="#172554" stroke="#475569"/>
  <rect x="143" y="161" width="7" height="7" rx="2" fill="#38bdf8"/>
  <rect x="153" y="161" width="7" height="7" rx="2" fill="#a78bfa"/>
  <rect x="143" y="171" width="7" height="7" rx="2" fill="#34d399"/>
