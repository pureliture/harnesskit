activation_gates:
- id: claude-prompt-submit-hook-review
  target: claude
  reason: Claude prompt-submit hook changes user runtime behavior and should be reviewed
    separately from file materialization.
  required_before_apply: false
  required_before_runtime: true
- id: codex-hook-trust
  target: codex
  reason: Codex user-level hooks require trust state before runtime execution.
  required_before_apply: false
  required_before_runtime: true
- id: hermes-shell-hook-consent
  target: hermes
  reason: Hermes shell hooks execute local commands and require exact event/command
    allowlist consent before runtime use.
  required_before_apply: false
  required_before_runtime: true
